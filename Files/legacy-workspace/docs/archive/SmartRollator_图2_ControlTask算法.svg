<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 880">
<defs>
<style>@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
text{font-family:'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif;}</style>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0L0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
<marker id="ac" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#22d3ee"/></marker>
<marker id="ag" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#34d399"/></marker>
<marker id="ao" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#fb923c"/></marker>
<marker id="av" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#a78bfa"/></marker>
<marker id="ay" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#fbbf24"/></marker>
<marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#fb7185"/></marker>
<marker id="as" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#94a3b8"/></marker>
</defs>
<rect width="100%" height="100%" fill="#0f172a"/>
<rect width="100%" height="100%" fill="url(#grid)"/>
<text x="20" y="28" fill="white" font-size="15" font-weight="700">图2: ControlTask 核心算法 (1kHz)</text>
<rect x="10" y="40" width="760" height="830" rx="10" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="8,4"/><text x="22" y="56" fill="#34d399" font-size="9" font-weight="600">Controller_Run(fx, dt=0.001) — 核心控制链路</text><rect x="260" y="70" width="260" height="55" rx="6" fill="#0f172a"/>
<rect x="260" y="70" width="260" height="55" rx="6" fill="rgba(251,146,60,0.3)" stroke="#fb923c" stroke-width="1.5"/>
<text x="390.0" y="101" fill="white" font-size="11" font-weight="600" text-anchor="middle">ForceQueue → mq_get_latest()</text>
<text x="390.0" y="117" fill="#94a3b8" font-size="8" text-anchor="middle">ForceMsg_t: fx_l, fx_r, ts</text><line x1="390" y1="125" x2="390" y2="155" stroke="#34d399" stroke-width="1.5" marker-end="url(#arr-#)"/><rect x="230" y="160" width="320" height="50" rx="6" fill="#0f172a"/>
<rect x="230" y="160" width="320" height="50" rx="6" fill="rgba(136,19,55,0.3)" stroke="#fb7185" stroke-width="1.5"/>
<text x="390.0" y="189" fill="white" font-size="11" font-weight="600" text-anchor="middle">新鲜度检查</text>
<text x="390.0" y="205" fill="#94a3b8" font-size="8" text-anchor="middle">now - ts > 100ms → F_x = 0 (超时清零)</text><line x1="390" y1="210" x2="390" y2="240" stroke="#34d399" stroke-width="1.5" marker-end="url(#arr-#)"/><rect x="135" y="245" width="510" height="140" rx="6" fill="#0f172a"/>
<rect x="135" y="245" width="510" height="140" rx="6" fill="rgba(6,78,59,0.45)" stroke="#34d399" stroke-width="1.5"/>
<text x="390.0" y="319" fill="white" font-size="11" font-weight="600" text-anchor="middle">Hopf CPG 振荡器</text><text x="390" y="278" fill="#94a3b8" font-size="9" text-anchor="middle">r² = x² + y²   配参: α=10, μ=1, ω≈0.9Hz, ε=0.01</text><text x="390" y="298" fill="#22d3ee" font-size="10" font-weight="500" text-anchor="middle">dx/dt = α(μ − r²)x − ωy + ε · F_ext</text><text x="390" y="320" fill="#22d3ee" font-size="10" font-weight="500" text-anchor="middle">dy/dt = α(μ − r²)y + ωx</text><text x="390" y="350" fill="#64748b" font-size="8" text-anchor="middle">F_ext: 外力耦合项 (fx_l, fx_r 经 CPG_Couple 变换) | 频率收敛至 ω=2π·step_rate, 安全范围[0.3,2.0]Hz</text><text x="390" y="370" fill="#64748b" font-size="8" text-anchor="middle">初始条件 x₀=0.05, y₀=0 | 输出: 振荡状态 x (用作阻尼调制)</text><line x1="390" y1="385" x2="390" y2="415" stroke="#34d399" stroke-width="1.5" marker-end="url(#arr-#)"/><rect x="135" y="420" width="510" height="120" rx="6" fill="#0f172a"/>
<rect x="135" y="420" width="510" height="120" rx="6" fill="rgba(6,78,59,0.45)" stroke="#34d399" stroke-width="1.5"/>
<text x="390.0" y="484" fill="white" font-size="11" font-weight="600" text-anchor="middle">变导纳控制</text><text x="390" y="453" fill="#94a3b8" font-size="9" text-anchor="middle">动态阻尼: D = D_base − λ · x   限幅 [15, 80]</text><text x="390" y="475" fill="#22d3ee" font-size="10" font-weight="500" text-anchor="middle">M · a_c + D · v_c = F_ext</text><text x="390" y="500" fill="#64748b" font-size="8" text-anchor="middle">惯性 M=15kg | 基础阻尼 D_base=40 N·s/m | 调制系数 λ=20 N·s/m²</text><text x="390" y="520" fill="#64748b" font-size="8" text-anchor="middle">F_ext 取两手把力的较大值 | 欧拉积分: v_c += a_c·dt | a_c = (F_ext − D·v_c) / M</text><line x1="390" y1="540" x2="390" y2="570" stroke="#34d399" stroke-width="1.5" marker-end="url(#arr-#)"/><rect x="260" y="575" width="260" height="50" rx="6" fill="#0f172a"/>
<rect x="260" y="575" width="260" height="50" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
<text x="390.0" y="604" fill="white" font-size="11" font-weight="600" text-anchor="middle">v_c 速度指令 [m/s]</text>
<text x="390.0" y="620" fill="#94a3b8" font-size="8" text-anchor="middle">输出范围: [-0.5, 1.2] m/s</text><line x1="390" y1="625" x2="390" y2="655" stroke="#34d399" stroke-width="1.5" marker-end="url(#arr-#)"/><rect x="210" y="660" width="360" height="50" rx="6" fill="#0f172a"/>
<rect x="210" y="660" width="360" height="50" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
<text x="390.0" y="689" fill="white" font-size="11" font-weight="600" text-anchor="middle">m/s → rpm 转换</text>
<text x="390.0" y="705" fill="#94a3b8" font-size="8" text-anchor="middle">rpm = v_c × 60 / (2π × 0.075) = v_c × 127.32</text><line x1="390" y1="710" x2="390" y2="740" stroke="#34d399" stroke-width="1.5" marker-end="url(#arr-#)"/><rect x="250" y="745" width="280" height="50" rx="6" fill="#0f172a"/>
<rect x="250" y="745" width="280" height="50" rx="6" fill="rgba(136,19,55,0.3)" stroke="#fb7185" stroke-width="1.5"/>
<text x="390.0" y="774" fill="white" font-size="11" font-weight="600" text-anchor="middle">clamp ±400 rpm</text>
<text x="390.0" y="790" fill="#94a3b8" font-size="8" text-anchor="middle">左轮+rpm 右轮-rpm → MotorCmd_t</text><line x1="390" y1="795" x2="390" y2="825" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arr-#)"/><rect x="260" y="820" width="260" height="45" rx="6" fill="#0f172a"/>
<rect x="260" y="820" width="260" height="45" rx="6" fill="rgba(251,146,60,0.35)" stroke="#fb923c" stroke-width="1.5"/>
<text x="390.0" y="846" fill="white" font-size="11" font-weight="600" text-anchor="middle">MotorCmdQueue</text>
<text x="390.0" y="862" fill="#94a3b8" font-size="8" text-anchor="middle">osMsgQPut → MotorTxTask</text></svg>