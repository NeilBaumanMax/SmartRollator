<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 740">
<defs>
<style>@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
text{font-family:'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif;}</style>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0L0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
<marker id="ac" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#22d3ee"/></marker>
<marker id="ag" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#34d399"/></marker>
<marker id="ao" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#fb923c"/></marker>
<marker id="av" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#a78bfa"/></marker>
<marker id="ay" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#fbbf24"/></marker>
<marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#fb7185"/></marker>
<marker id="as" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#94a3b8"/></marker>
</defs>
<rect width="100%" height="100%" fill="#0f172a"/>
<rect width="100%" height="100%" fill="url(#grid)"/>
<text x="20" y="28" fill="white" font-size="15" font-weight="700">图4: 6层安全保护 — 洋葱模型</text>
<rect x="160" y="180" width="600" height="420" rx="12" fill="#0f172a"/><rect x="160" y="180" width="600" height="420" rx="12" fill="rgba(136,19,55,0.15)" stroke="#fb7185" stroke-width="1.5"/><text x="174" y="202" fill="#fb7185" font-size="10" font-weight="600">L1: 输入保护</text><text x="174" y="224" fill="#94a3b8" font-size="8">MODBUS 响应帧长度检查 (必须29字节)</text><text x="174" y="242" fill="#64748b" font-size="8">传感器数据空指针 / 零时间戳过滤</text><rect x="200" y="210" width="520" height="360" rx="12" fill="#0f172a"/><rect x="200" y="210" width="520" height="360" rx="12" fill="rgba(136,19,55,0.2)" stroke="#fb7185" stroke-width="1.5"/><text x="214" y="232" fill="#fb7185" font-size="10" font-weight="600">L2: 队列传输隔离</text><text x="214" y="254" fill="#94a3b8" font-size="8">FreeRTOS 队列容量 8，溢出自动丢弃最旧</text><text x="214" y="272" fill="#64748b" font-size="8">mq_get_latest() 始终取最新数据，避免堆积延迟</text><rect x="240" y="240" width="440" height="300" rx="12" fill="#0f172a"/><rect x="240" y="240" width="440" height="300" rx="12" fill="rgba(136,19,55,0.25)" stroke="#fb7185" stroke-width="1.5"/><text x="254" y="262" fill="#fb7185" font-size="10" font-weight="600">L3: 新鲜度检查</text><text x="254" y="284" fill="#94a3b8" font-size="8">传感器: now - ts > 100ms → F_x = 0</text><text x="254" y="302" fill="#64748b" font-size="8">电机反馈: MotorFb_t 超时同样清零 → 停转</text><rect x="280" y="270" width="360" height="240" rx="12" fill="#0f172a"/><rect x="280" y="270" width="360" height="240" rx="12" fill="rgba(136,19,55,0.3)" stroke="#fb7185" stroke-width="1.5"/><text x="294" y="292" fill="#fb7185" font-size="10" font-weight="600">L4: 算法层限幅 (核心)</text><text x="294" y="314" fill="#94a3b8" font-size="8">NaN/Inf → CPG_ClampFinite · F_ext±500N · x/y状态±5.0</text><text x="294" y="332" fill="#64748b" font-size="8">dx/dy/a_c±200 · D阻尼[15,80] · dt步长[0.1ms,100ms] · 参数≥0.0001 · 步频[0.3,2.0]Hz</text><rect x="320" y="300" width="280" height="180" rx="12" fill="#0f172a"/><rect x="320" y="300" width="280" height="180" rx="12" fill="rgba(136,19,55,0.35)" stroke="#fb7185" stroke-width="1.5"/><text x="334" y="322" fill="#fb7185" font-size="10" font-weight="600">L5: 输出保护</text><text x="334" y="344" fill="#94a3b8" font-size="8">v_c: [-0.5, 1.2] m/s</text><text x="334" y="362" fill="#64748b" font-size="8">target_rpm: clmap ±400 rpm</text><rect x="360" y="330" width="200" height="120" rx="12" fill="#0f172a"/><rect x="360" y="330" width="200" height="120" rx="12" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/><text x="374" y="352" fill="#fb7185" font-size="10" font-weight="600">L6: 全局兜底</text><text x="374" y="374" fill="#94a3b8" font-size="8">configASSERT 失败 → 关全局中断</text><text x="374" y="392" fill="#64748b" font-size="8">__disable_irq() → while(1) 死循环停留</text><text x="460" y="390" fill="#fb7185" font-size="13" font-weight="700" text-anchor="middle">安全</text><text x="460" y="412" fill="#fb7185" font-size="13" font-weight="700" text-anchor="middle">核心</text><rect x="20" y="660" width="860" height="60" rx="8" fill="#0f172a"/><rect x="20" y="660" width="860" height="60" rx="8" fill="rgba(30,41,59,0.4)" stroke="#475569" stroke-width="1"/><text x="450" y="686" fill="#94a3b8" font-size="9" text-anchor="middle">从外到内: 数据逐层穿透，每层皆为硬约束。异常在任意层被捕获后，向下传递安全默认值 (0或停转)，最终兜底为硬件死循环。</text><text x="450" y="706" fill="#64748b" font-size="8" text-anchor="middle">设计原则: fail-safe by default — 宁可停车，不可失控。所有 NaN/Inf/超时/越界均已拦截，不存在静默错误路径。</text></svg>